<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRMS Enterprise - Hệ Thống Quản Trị Nhân Sự</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('hrms_web_theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#080B14' : '#F6F7FB';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
